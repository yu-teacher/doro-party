server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/manifest+json application/xml image/svg+xml;

    # 보안 헤더(CSP·HSTS 는 게이트웨이가 부여한다).
    # nginx 는 location 에 add_header 가 하나라도 있으면 server 수준 헤더를 상속하지 않으므로 같은 헤더를 다시 선언한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 파일명에 해시가 들어간 정적 자산은 영구 캐시. 없는 해시 파일은 index.html 로 폴백하지 않고 404
    location /party/assets/ {
        try_files $uri =404;
        # always 를 쓰지 않아 성공 응답에만 붙는다(없는 파일의 404 가 1년 캐시되지 않게)
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # service worker 와 manifest 는 매번 재검증해야 새 배포가 바로 반영된다(오래 캐시되면 옛 앱 셸이 계속 뜬다)
    location ~ ^/party/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA 진입점. 항상 재검증하여 새 배포의 해시 자산을 바로 가리키게 한다
    location /party/ {
        try_files $uri $uri/ /party/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 이 컨테이너는 /party/ 아래만 서빙한다. 그 밖의 경로에 nginx 기본 페이지가 열리지 않게 한다
    location / {
        return 404;
    }

    # /party 로 들어오면 슬래시를 붙여 준다
    location = /party {
        return 301 /party/;
    }
}
