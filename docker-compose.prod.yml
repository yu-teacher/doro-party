services:
  party-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doro-party-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: service_party
      DB_USER: ${DB_USER:-doro_admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      IAM_HOST: auth-api
      IAM_PORT: 8080
      # Doro IAM 내부 API(탈퇴 사용자 목록) 호출자 토큰. IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'party:<토큰>' 으로 등록한 값이다.
      DORO_IAM_INTERNAL_TOKEN: ${DORO_IAM_INTERNAL_TOKEN:-}
      GUARD_GRPC_HOST: guard-api
      GUARD_GRPC_PORT: 9090
      GUARD_HTTP_HOST: guard-api
      GUARD_HTTP_PORT: 8081
      DORO_GUARD_SERVICE_TOKEN: ${DORO_GUARD_SERVICE_TOKEN:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-doro_admin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_SECRET_KEY(서비스 전용 키) 또는 MINIO_ROOT_PASSWORD 가 .env 에 있어야 한다}}
      MINIO_BUCKET: doro-party-media
      PARTY_OAUTH_CLIENT_ID: ${PARTY_OAUTH_CLIENT_ID:-doro-party}
      PARTY_OAUTH_AUTHORIZE_URL: ${PARTY_OAUTH_AUTHORIZE_URL:?PARTY_OAUTH_AUTHORIZE_URL must be set in .env}
      PARTY_OAUTH_REDIRECT_URI: ${PARTY_OAUTH_REDIRECT_URI:?PARTY_OAUTH_REDIRECT_URI must be set in .env}
      # embedded(기본): 로그인·세션을 이 서비스가 한다. gateway: 별도 BFF(doro-bff)가 하고 게이트웨이가 Bearer 를 붙여 준다(docs/BFF.md).
      PARTY_AUTH_MODE: ${PARTY_AUTH_MODE:-embedded}
      PARTY_SESSION_KEY: ${PARTY_SESSION_KEY:?PARTY_SESSION_KEY must be set in .env}
      # 웹 푸시(알림). 키가 비어 있으면 푸시만 꺼진 채 앱은 그대로 동작한다. 값은 .env 에만 둔다(scripts/setup-push-server.sh).
      PARTY_VAPID_PUBLIC_KEY: ${PARTY_VAPID_PUBLIC_KEY:-}
      PARTY_VAPID_PRIVATE_KEY: ${PARTY_VAPID_PRIVATE_KEY:-}
      PARTY_VAPID_SUBJECT: ${PARTY_VAPID_SUBJECT:-}
      # 플랫폼 알림 서비스(doro-notify) 이관 검증. 기본(LEGACY)은 지금처럼 파티가 직접 보내고 알림 서비스를 부르지 않는다. SHADOW 는 같은 알림을 dryRun 으로 물어 비교만 한다.
      PARTY_NOTIFY_MODE: ${PARTY_NOTIFY_MODE:-LEGACY}
      PARTY_NOTIFY_TOKEN: ${PARTY_NOTIFY_TOKEN:-}
    networks:
      - doro-network

  party-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: doro-party-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    depends_on:
      - party-api
    networks:
      - doro-network

networks:
  doro-network:
    external: true
    name: doro_doro-network
