# ------------------------------------------------------------------------------
# 도로 파티 게이트웨이 설정 조각 (Doro gateway/nginx.conf 에 수동으로 반영한다)
#
# 게이트웨이 nginx.conf 는 CI 가 배포하지 않으므로 서버에서 직접 복사한 뒤
#   docker exec doro-gateway nginx -t && docker exec doro-gateway nginx -s reload
# 로 반영한다. 반영 전에 기존 파일을 백업해 둔다.
# ------------------------------------------------------------------------------

# 1) http 블록의 upstream 모음에 추가
upstream party_web_upstream {
    server doro-party-web:80;
}

upstream party_api_upstream {
    server doro-party-api:8086;
}

# 2) server(443) 블록에 추가. 블로그의 `location /api/v1/` 과 겹치지 않는다
#    (nginx 는 접두사 location 중 가장 긴 것을 고르며, 정규식 location 은 /party/ 와 맞지 않는다).

# 2-1) API: /party/api/... -> 백엔드의 /api/...
location /party/api/ {
    proxy_pass http://party_api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2-2) 사진: 버킷 자체(목록 조회)는 공개하지 않는다. 블로그의 /media/ 와 같은 방어를 적용한다.
location = /party/media/ {
    return 404;
}

location /party/media/ {
    if ($args ~* "(^|&)(list-type|prefix|delimiter|marker|max-keys|versions|uploads)(=|&|$)") {
        return 404;
    }

    proxy_pass http://minio_upstream/doro-party-media/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox" always;
}

# 2-3) 웹(PWA). 카카오맵 SDK 를 허용하는 전용 CSP 를 쓴다(서버 수준 CSP 는 script-src 가 'self' 와 GA 만 허용해 지도가 막힌다).
#      블로그/포털의 CSP 는 건드리지 않는다. location 에 add_header 가 있으면 서버 수준 헤더를 상속하지 않으므로 공통 헤더를 다시 적는다.
#      처음 반영할 때는 Content-Security-Policy-Report-Only 로 바꿔 /csp-report 에 위반이 없는지 보고, 문제가 없으면 강제로 전환한다.
location /party/ {
    proxy_pass http://party_web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net https://*.kakao.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
}

location = /party {
    return 301 /party/;
}
