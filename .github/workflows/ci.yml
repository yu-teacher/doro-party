name: CI

# main 푸시와 PR 마다 린트·타입·테스트를 돌린다. 배포는 하지 않는다 (배포는 scripts/deploy.sh).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      # 모바일 레이아웃 회귀 테스트: 실제 Chromium 으로 폰 4가지 크기(320·375·414 세로, 812x375 가로)에서 가로 넘침·글자 잘림·터치 영역·입력 글꼴을 측정한다.
      # Playwright 브라우저(Chromium)는 버전이 같으면 다시 내려받지 않는다. 시스템 라이브러리는 캐시와 무관하게 매번 설치해야 한다.
      - name: Playwright 버전
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Playwright 설치 (캐시 없음 - 브라우저와 시스템 라이브러리)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright 설치 (캐시 있음 - 시스템 라이브러리만)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:mobile
      - run: npm run build

  backend:
    name: Backend (tests on an isolated Postgres/Redis/Guard/S3 stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # build.gradle 의 includeBuild('../Doro') 와 Guard 이미지 빌드를 위해 Doro 레포를 형제 디렉터리로 받는다.
      - uses: actions/checkout@v4
        with:
          path: doro-party
      - uses: actions/checkout@v4
        with:
          repository: yu-teacher/doro
          path: Doro
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run backend tests
        working-directory: doro-party
        run: scripts/ci-test.sh backend
